[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis-calendar"
version = "0.1.0"
description = "Artemis II calendar image selection data platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
artemis-pipeline = "artemis_calendar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
web = [
    "fastapi[standard]>=0.115",
]
ml = [
    "pillow>=10.0",
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "hdbscan>=0.8.33",
    "nltk>=3.9",
    "scipy>=1.12",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/artemis_calendar/web/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/artemis_calendar"]
