name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[web]

      - name: Download warehouse database
        run: |
          gh release download warehouse-v1 -p warehouse.duckdb.gz -D /tmp
          gunzip -c /tmp/warehouse.duckdb.gz > D:/artemis/warehouse.duckdb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site
        run: python scripts/build_static.py --base-path /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
