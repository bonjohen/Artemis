<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; connect-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
<title>Lesson — Artemis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231A1D24'/><text x='50' y='72' font-size='58' font-family='Georgia' fill='%23D97757' text-anchor='middle' font-style='italic'>A</text></svg>" />
<link rel="stylesheet" href="system/tokens.css" />
<link rel="stylesheet" href="system/system.css" />
<style>
  .lesson-shell {
    max-width: 760px;
    margin: 0 auto;
    padding: var(--s-7) var(--s-5) var(--s-9);
  }

  .lesson-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--atlas-muted);
    text-decoration: none;
    margin-bottom: var(--s-5);
  }
  .lesson-back:hover { color: var(--atlas-ink); }

  .lesson-content h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(32px, 4vw, 48px);
    letter-spacing: -.02em;
    line-height: var(--lh-tight);
    margin: 0 0 var(--s-6);
    padding-bottom: var(--s-5);
    border-bottom: 1px solid var(--atlas-rule-soft);
  }

  .lesson-content h2 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: -.01em;
    margin: var(--s-7) 0 var(--s-4);
    color: var(--atlas-ink);
  }

  .lesson-content h3 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 16px;
    margin: var(--s-5) 0 var(--s-3);
    color: var(--atlas-ink);
  }

  .lesson-content p {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.7;
    color: var(--atlas-ink-2);
    margin: 0 0 var(--s-4);
  }

  .lesson-content ul, .lesson-content ol {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.7;
    color: var(--atlas-ink-2);
    padding-left: 1.5em;
    margin: 0 0 var(--s-4);
  }
  .lesson-content li {
    margin-bottom: var(--s-3);
  }
  .lesson-content li strong {
    color: var(--atlas-ink);
  }

  .lesson-content code {
    font-family: var(--mono);
    font-size: 14px;
    background: var(--atlas-paper-2);
    padding: 2px 6px;
    border-radius: var(--r-sm);
    border: 1px solid var(--atlas-rule-soft);
  }

  .lesson-content pre {
    background: var(--atlas-paper-2);
    border: 1px solid var(--atlas-rule-soft);
    border-radius: var(--r-md);
    padding: var(--s-4);
    overflow-x: auto;
    margin: 0 0 var(--s-4);
  }
  .lesson-content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.6;
  }

  .lesson-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 var(--s-4);
    font-size: 14px;
  }
  .lesson-content th, .lesson-content td {
    text-align: left;
    padding: var(--s-2) var(--s-3);
    border-bottom: 1px solid var(--atlas-rule-soft);
  }
  .lesson-content th {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--atlas-muted);
    font-weight: 500;
  }
  .lesson-content td {
    font-family: var(--serif);
    color: var(--atlas-ink-2);
  }

  .lesson-content blockquote {
    border-left: 3px solid var(--atlas-accent);
    margin: 0 0 var(--s-4);
    padding: var(--s-3) var(--s-4);
    color: var(--atlas-ink-2);
    font-family: var(--serif);
    font-style: italic;
  }

  .lesson-content a {
    color: var(--atlas-accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .lesson-content a:hover {
    color: var(--atlas-ink);
  }

  .lesson-content hr {
    border: none;
    border-top: 1px solid var(--atlas-rule-soft);
    margin: var(--s-6) 0;
  }

  .lesson-error {
    text-align: center;
    padding: var(--s-9) 0;
    color: var(--atlas-muted);
    font-family: var(--serif);
    font-size: 18px;
  }

  .nav-actions { display: flex; gap: 8px; align-items: center; }
  .theme-toggle {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--atlas-ink);
    border: 1px solid var(--atlas-rule-soft);
    border-radius: var(--r-sm);
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--atlas-ink); }
  .theme-toggle svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="lessons.html" class="brand"><span class="mark"></span> Artemis</a>
  <div class="links">
    <a href="lessons.html" aria-current="page">Lessons</a>
  </div>
  <div class="nav-actions">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>

<main class="lesson-shell">
  <a href="lessons.html" class="lesson-back">&#8592; All Lessons</a>
  <article class="lesson-content" id="lesson-content">
    <p style="color:var(--atlas-muted);font-family:var(--mono);font-size:13px;">Loading...</p>
  </article>
</main>

<footer style="border-top:1px solid var(--atlas-rule-soft);padding:var(--s-6) var(--s-7);text-align:center;color:var(--atlas-muted);font-size:13px;">
  Artemis II Calendar &middot; Lessons extracted from real project work.
</footer>

<script type="module" src="system/lesson.js"></script>
</body>
</html>
